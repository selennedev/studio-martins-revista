<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fotos do catálogo | Martins Studio</title><link rel="stylesheet" href="./styles.css"><style>
body{background:#f4f1eb;color:#292820;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:48px auto;padding:24px}.panel{background:#fff;border:1px solid #ddd4c8;padding:28px;margin:18px 0}.panel h1,.panel h2{font-family:Georgia,serif;font-weight:400}.field{display:grid;gap:8px;margin:16px 0;font-size:13px}.field input,.field select{padding:12px;border:1px solid #d8d0c5;background:#fff;width:100%}button{background:#b79a43;color:white;border:0;padding:13px 18px;cursor:pointer}.muted{color:#777;font-size:13px;line-height:1.6}#status{margin-top:14px}
</style></head><body><main class="wrap"><section class="panel"><p class="muted">MARTINS STUDIO · ÁREA ADMINISTRATIVA</p><h1>Fotografias dos procedimentos</h1><p class="muted">Entre com a conta administradora. Selecione a profissional, o procedimento e a imagem correspondente. Arquivos JPG, PNG ou WebP até 5 MB.</p><div id="login"><label class="field">E-mail<input id="email" type="email"></label><label class="field">Senha<input id="password" type="password"></label><button id="loginBtn">Entrar</button></div><div id="uploader" hidden><label class="field">Profissional<select id="professional"></select></label><label class="field">Procedimento<select id="service"></select></label><label class="field">Fotografia<input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="uploadBtn">Enviar e vincular imagem</button><p id="status" class="muted"></p><button id="logout" type="button">Sair</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./photos.js"></script></body></html>
